[project]
name = "chess-project"
version = "0.1.0"
description = "A terminal chess game with legal random AI, built as a base for future ML training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.999",
    "rich>=13.7",
    "textual>=0.85",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
chess = "chess_app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
